<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(14px,1.6vw,20px) clamp(24px,3vw,40px);background:rgba(12,12,12,0.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.06);font-family:Kanit,'Noto Sans TC',sans-serif;font-weight:500;letter-spacing:0.08em;font-size:clamp(14px,1.3vw,18px);position:relative;z-index:50">
  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;min-width:0">
    <img src="./assets/fcu-logo-white.png" alt="逢甲大學校徽" style="width:46px;height:46px;flex-shrink:0;display:block">
    <a href="./index.dc.html" style="display:flex;flex-direction:column;gap:3px;line-height:1.2;min-width:0">
      <span style="font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:clamp(15px,1.2vw,17px);letter-spacing:0.04em;color:#ffffff;white-space:nowrap">逢甲大學半導體學院</span>
      <span style="font-family:Kanit,sans-serif;font-weight:400;font-size:clamp(9px,0.75vw,11px);letter-spacing:0.12em;text-transform:uppercase;color:#9AA6B0;white-space:nowrap">School of Semiconductor Engineering</span>
    </a>
  </div>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:clamp(20px,3vw,48px)">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
        <div onMouseEnter="{{ m.enter }}" onMouseLeave="{{ closeMenu }}" style="position:relative;padding:8px 0">
          <a href="{{ m.href }}" onClick="{{ m.click }}" style="display:flex;align-items:center;gap:8px;color:{{ m.color }};transition:opacity .2s" style-hover="opacity:0.7">
            <span>{{ m.label }}</span>
            <sc-if value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:0.6em;opacity:0.6">▾</span></sc-if>
          </a>
          <sc-if value="{{ m.open }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;top:100%;right:0;padding-top:8px;z-index:60">
              <div style="background:#151515;border:1px solid #2A2A2A;border-radius:16px;padding:8px;min-width:220px;display:flex;flex-direction:column;gap:2px;box-shadow:0 20px 40px rgba(0,0,0,0.5)">
                <sc-for list="{{ m.subs }}" as="s" hint-placeholder-count="2">
                  <a href="{{ s.href }}" style="display:block;padding:12px 16px;border-radius:10px;font-family:'Noto Sans TC',sans-serif;font-weight:400;font-size:15px;letter-spacing:0.04em;color:{{ s.color }};white-space:nowrap;transition:background .2s" style-hover="background:#222222;color:#ffffff">{{ s.label }}</a>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMobile }}" style="width:44px;height:44px;border-radius:22px;border:1px solid #3A3A3A;background:transparent;color:#D7E2EA;font-size:18px;cursor:pointer">☰</button>
  </sc-if>
</nav>
<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:100;background:#0C0C0C;overflow-y:auto;padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px">
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;min-width:0">
    <img src="./assets/fcu-logo-white.png" alt="逢甲大學校徽" style="width:46px;height:46px;flex-shrink:0;display:block">
    <a href="./index.dc.html" style="display:flex;flex-direction:column;gap:3px;line-height:1.2;min-width:0">
      <span style="font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:clamp(15px,1.2vw,17px);letter-spacing:0.04em;color:#ffffff;white-space:nowrap">逢甲大學半導體學院</span>
      <span style="font-family:Kanit,sans-serif;font-weight:400;font-size:clamp(9px,0.75vw,11px);letter-spacing:0.12em;text-transform:uppercase;color:#9AA6B0;white-space:nowrap">School of Semiconductor Engineering</span>
    </a>
  </div>
      <button onClick="{{ toggleMobile }}" style="width:44px;height:44px;border-radius:22px;border:1px solid #3A3A3A;background:transparent;color:#D7E2EA;font-size:18px;cursor:pointer">✕</button>
    </div>
    <div style="display:flex;flex-direction:column">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
        <div style="border-top:1px solid #222222;padding:20px 0;display:flex;flex-direction:column;gap:12px">
          <a href="{{ m.href }}" style="font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:24px;color:#ffffff">{{ m.label }}</a>
          <sc-for list="{{ m.subs }}" as="s" hint-placeholder-count="0">
            <a href="{{ s.href }}" style="font-family:'Noto Sans TC',sans-serif;font-weight:300;font-size:16px;color:{{ s.color }};padding:6px 0">{{ s.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { vw: null, openMenu: null, mobileOpen: false };
  componentDidMount() { this.onVw = () => this.setState({ vw: window.innerWidth }); this.onVw(); window.addEventListener('resize', this.onVw); }
  componentWillUnmount() { window.removeEventListener('resize', this.onVw); }
  renderVals() {
    const F = {'逢甲大學X志聖工業':'about-fcu-csun','院長':'about-dean','執行長':'about-ceo','學院師資':'faculty','課程說明':'curriculum','招生資訊':'admissions','重點實驗室':'labs','產學共建實驗室':'labs-cleanroom','獎學金與就業保障':'scholarship'};
    const p = n => './' + F[n] + '.dc.html';
    const M = [
      ['關於學院', [['逢甲大學X志聖工業'], ['院長'], ['執行長']]],
      ['學院師資', [['學院師資']]],
      ['課程介紹', [['課程說明'], ['獎學金與就業保障']]],
      ['招生專區', [['招生資訊']]],
      ['重點實驗室', [['產學共建實驗室']]],
    ];
    const cur = this.props.current, st = this.state;
    const menu = M.map(([label, subs], i) => {
      const active = label === cur || subs.some(([l]) => l === cur);
      return {
        label, href: subs.length ? p(subs[0][0]) : p(label), hasSub: subs.length > 0, open: st.openMenu === i,
        color: active ? '#ffffff' : '#D7E2EA',
        subs: subs.map(([l]) => ({ label: l, href: p(l), color: l === cur ? '#F08050' : '#D7E2EA' })),
        enter: () => subs.length && this.setState({ openMenu: i }),
        click: e => { if (subs.length && st.vw >= 760) { e.preventDefault(); this.setState({ openMenu: st.openMenu === i ? null : i }); } },
      };
    });
    const desktop = st.vw == null || st.vw >= 760;
    return {
      menu, desktop, mobile: !desktop, mobileOpen: !desktop && st.mobileOpen,
      closeMenu: () => this.setState({ openMenu: null }),
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
    };
  }
}
</script>
</body>
</html>
