<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap">
<script src="./image-slot.js"></script>
<style>
html,body{background:#0C0C0C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Kanit,"Noto Sans TC",sans-serif;color:#D7E2EA;-webkit-font-smoothing:antialiased}
a{color:#D7E2EA;text-decoration:none}
a:hover{color:#ffffff}
</style>
</helmet>
<div style="background:#0C0C0C;min-height:100vh;display:flex;flex-direction:column;overflow-x:clip;font-family:Kanit,'Noto Sans TC',sans-serif">
  <dc-import name="SiteNav" current="學院師資" hint-size="100%,80px" style="position:sticky;top:0;z-index:50;display:block"></dc-import>
  <header data-screen-label="01 頁首" style="padding:clamp(64px,9vw,140px) clamp(24px,3vw,40px) clamp(48px,6vw,96px);display:flex;flex-direction:column;gap:clamp(16px,2vw,28px)">
    <div style="display:flex;gap:10px;align-items:center;font-family:'Noto Sans TC',sans-serif;font-size:clamp(13px,1vw,15px);letter-spacing:0.08em;color:#7f8a93">
      <a href="./index.dc.html" style="color:#7f8a93" style-hover="color:#ffffff">首頁</a><span>/</span><a href="./faculty.dc.html" style="color:#7f8a93" style-hover="color:#ffffff">學院師資</a><span>/</span><a href="./faculty.dc.html" style="color:#D7E2EA" aria-current="page">學院師資</a>
    </div>
    <h1 style="font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:clamp(48px,10vw,150px);line-height:1.05;letter-spacing:-0.02em;background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent">學院師資</h1>
    <p style="font-family:Kanit,sans-serif;font-weight:300;font-size:clamp(12px,1.1vw,16px);letter-spacing:0.2em;text-transform:uppercase;color:#7f8a93">Faculty</p>
  </header>
  <main data-screen-label="02 內容" style="flex:1;background:#FFFFFF;color:#0C0C0C;border-radius:clamp(40px,4.5vw,60px) clamp(40px,4.5vw,60px) 0 0;padding:clamp(64px,8vw,120px) clamp(24px,3vw,40px);min-height:60vh">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(64px,8vw,112px)">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <section style="display:flex;flex-direction:column;gap:clamp(24px,3vw,40px)">
          <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:2px solid #0C0C0C">
            <span style="font-family:Kanit,sans-serif;font-weight:500;font-size:clamp(14px,1.2vw,18px);letter-spacing:0.1em;color:#A82838">{{ g.no }}</span>
            <h2 style="font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:clamp(32px,4.5vw,64px);line-height:1.1;letter-spacing:-0.01em;color:#0C0C0C">{{ g.title }}</h2>
            <span style="font-family:Kanit,sans-serif;font-weight:300;font-size:clamp(12px,1vw,15px);letter-spacing:0.16em;text-transform:uppercase;color:#646973">{{ g.en }}</span>
            <span style="margin-left:auto;font-family:'Noto Sans TC',sans-serif;font-size:14px;color:#646973">{{ g.count }} 位</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px">
            <sc-for list="{{ g.people }}" as="p" hint-placeholder-count="8">
              <div style="grid-column:{{ p.span }};border:1px solid #E3E7EA;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;background:#FFFFFF;transition:border-color .2s,transform .2s" style-hover="border-color:#0C0C0C;transform:translateY(-2px)">
                <span style="align-self:flex-start;font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:13px;letter-spacing:0.06em;color:#646973;background:#F2F4F6;border-radius:999px;padding:4px 12px">{{ p.dept }}</span>
                <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
                  <span style="font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:clamp(24px,2vw,30px);color:#0C0C0C">{{ p.name }}</span>
                  <span style="font-family:'Noto Sans TC',sans-serif;font-weight:400;font-size:15px;color:#3A3F46">{{ p.title }}</span>
                </div>
                <sc-if value="{{ p.hasDetail }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid #E3E7EA;font-family:'Noto Sans TC',sans-serif;font-size:15px;line-height:1.5">
                    <div style="display:grid;grid-template-columns:72px 1fr;gap:12px"><span style="color:#646973">實驗室</span><span style="color:#0C0C0C">{{ p.lab }}</span></div>
                    <div style="display:grid;grid-template-columns:72px 1fr;gap:12px"><span style="color:#646973">信箱</span><a href="{{ p.mailto }}" style="color:#A82838;word-break:break-all">{{ p.email }}</a></div>
                    <div style="display:grid;grid-template-columns:72px 1fr;gap:12px"><span style="color:#646973">分機</span><span style="color:#0C0C0C">{{ p.ext }}</span></div>
                    <a href="{{ p.url }}" style="align-self:flex-start;margin-top:8px;display:flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;background:#0C0C0C;color:#ffffff;font-size:14px;letter-spacing:0.08em" style-hover="background:#A82838;color:#ffffff">詳細資料 →</a>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </main>
  <footer data-screen-label="03 頁尾" style="background:#0C0C0C;padding:40px clamp(20px,3vw,40px)">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;font-family:'Noto Sans TC',sans-serif;font-size:13px;color:#7f8a93">
      <span>逢甲大學半導體學院（籌備中）｜School of Semiconductor Engineering, Feng Chia University</span>
      <span>407 台中市西屯區文華路 100 號</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  details = {
    '何主亮': { lab: '電漿工程實驗室', email: 'jlhe@o365.fcu.edu.tw', ext: '#5315', url: './faculty-ho-juliang.dc.html' },
  };
  data = [
    ['01', '關鍵設備研發', 'Key Equipment R&D', [
      ['材料系','何主亮','講座教授'],['材料系','沈育安','副教授'],['材料系','謝秉諺','助理教授'],['機電系','王啟昌','教授'],
      ['機電系','袁長安','教授'],['機電系','林孟儒','教授'],['機電系','詹彥信','副教授'],['機電系','方宏聲','兼任助理教授'],
      ['航太系','劉楊倫','助理教授'],['自控系','謝男凱','助理教授'],
    ]],
    ['02', '設備智慧化', 'Smart Equipment', [
      ['工工系','楊士霆','副教授'],['工工系','周哲維','助理教授'],['自控系','林育德','教授'],['自控系','林賢龍','教授'],
      ['自控系','黃清輝','助理教授'],['自控系','謝男凱','助理教授'],['機電系','王啟昌','教授'],['機電系','林玉堃','助理教授'],
      ['機電系','魏立儒','助理教授'],['資訊系','蔡明翰','副教授'],
    ]],
    ['03', '業界師資｜志聖工業', 'Industry Mentors · CSUN', [
      ['總經理室','梁又文','總經理'],['技術委員會','陳明宗','廠處長'],['IR','吳晏城','協理'],['前瞻技術處','許海津','總監'],
      ['營運長室','吳邦超','營運長'],['營運長室','曾文進','營運長'],['研發二處','賴智忠','副廠處長'],['研發二處-研三部','蔡朝仁','副廠長'],
      ['研發二處-研四部-研發課','林華偉','專案經理'],['研發二處-研四部-研發課','許嘉麟','課長'],['系控處','王啟毓','副廠處長'],['製造一處','許韻祥','廠處長'],
      ['半導體營業處','黃文雄','廠處長'],['半導體營運處-營業部','戴睿騰','課長'],['半導體研發處','霍正邦','專案經理'],['半導體研發處-研發部','賴家偉','經理'],
      ['半導體研發處-研發一課','吳宜勳','課長'],['半導體研發處-研發一課','廖晏瑋','組長'],['半導體研發處-研發電控課','曹帛垚','課長'],
    ]],
  ];
  state = { vw: 1200 };
  componentDidMount() { this.onVw = () => this.setState({ vw: window.innerWidth }); this.onVw(); window.addEventListener('resize', this.onVw); }
  componentWillUnmount() { window.removeEventListener('resize', this.onVw); }
  renderVals() {
    const wide = this.state.vw >= 600;
    return {
      groups: this.data.map(([no, title, en, ppl]) => ({
        no, title, en, count: ppl.length,
        people: ppl.map(([dept, name, title]) => {
          const d = this.details[name];
          return { dept, name, title, hasDetail: !!d, span: d && wide ? 'span 2' : 'auto', ...(d || {}), mailto: d ? 'mailto:' + d.email : '' };
        }),
      })),
    };
  }
}
</script>
</body>
</html>
